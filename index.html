<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estoque de livros</title>
<style>
:root{--bg:#eef2f5;--ink:#1b2a41;--mut:#5b6b7f;--ac:#0f766e;--ln:#cfd8e0;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
h1,h2{font-family:Georgia,'Iowan Old Style',serif;font-weight:700;margin:1.6rem 0 .6rem}h2{font-size:1.25rem}
nav{display:flex;gap:.25rem;overflow-x:auto;background:var(--ink);padding:.5rem;position:sticky;top:0;padding-top:max(.5rem,env(safe-area-inset-top))}
nav button{background:none;border:0;color:#b9c6d6;padding:.5rem .9rem;border-radius:6px;font:inherit;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff}
main{max-width:900px;margin:0 auto;padding:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.card{background:var(--card);border-left:5px solid var(--ac);padding:.9rem 1rem;border-radius:4px 12px 4px 12px}
.card b{display:block;font:700 2.4rem/1 Georgia,serif}.card span{color:var(--mut)}
form{display:flex;flex-wrap:wrap;gap:.5rem;background:var(--card);padding:.75rem;border-radius:10px;margin:.5rem 0}
form>p{flex:100%;margin:0;font-weight:600}
input,select{flex:1 1 140px;padding:.6rem;border:1px solid var(--ln);border-radius:6px;font:inherit;background:#fff}
button{cursor:pointer}form button,.btn{background:var(--ac);color:#fff;border:0;padding:.6rem 1.1rem;border-radius:6px;font:inherit;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--ln)}th{background:#e3e9ef;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}.chip{border:1px solid var(--ln);background:#fff;padding:.35rem .8rem;border-radius:99px;font:inherit}
.chip.on{background:var(--ink);color:#fff}.vazio{color:var(--mut);padding:.75rem}
#login{max-width:340px;margin:20vh auto}
.combo{position:relative;flex:1 1 140px}
.combo input{width:100%}
.cl{display:none;position:absolute;z-index:20;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--ln);border-radius:6px;max-height:220px;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.ci{padding:.55rem .8rem;cursor:pointer}
.ci:hover{background:#eef2f5}
.ci.vazio{color:var(--mut);cursor:default}
.btn-x{background:#fff;color:#b91c1c;border:1px solid #b91c1c;padding:.35rem .7rem;border-radius:6px;font:inherit;font-size:.85rem;white-space:nowrap}
.btn-x:hover{background:#fef2f2}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
@media(max-width:640px){
  main{padding:.75rem .75rem 3rem}h2{font-size:1.15rem}
  nav button{padding:.7rem 1rem}
  form{flex-direction:column;gap:.6rem}
  input,select,form button{flex:none;width:100%;min-height:48px}
  .combo{flex:none;width:100%}
  .chip{padding:.55rem 1rem}
  .card b{font-size:2rem}
  table{background:none}
  table,tbody{display:block}
  tr:first-child{display:none}
  tr{display:block;background:var(--card);border:1px solid var(--ln);border-radius:10px;margin:.5rem 0;padding:.4rem .8rem}
  td{display:flex;justify-content:space-between;gap:1rem;border:0;padding:.3rem 0;text-align:right}
  td::before{content:attr(data-l);color:var(--mut);text-align:left}
}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://eznzexfapeadikmbwkyl.supabase.co', SUPABASE_KEY='sb_publishable_2y8fniyH61hzrrQq0AtCxw_ZmqyCFFB';
// O Supabase exige um email por baixo. O utilizador escreve só o nome; a app junta este sufixo.
const DOMINIO='@code.com';
if(SUPABASE_URL.startsWith('COLE')||SUPABASE_KEY.startsWith('COLE')){document.body.innerHTML='<p style="padding:2rem">Falta colar a URL e a chave do Supabase no topo do index.html.</p>';throw new Error('Supabase não configurado');}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
let D={livros:[],kits:[],lideres:[],eventos:[],equipes:[],saidas:[],hist:[]},tab='painel',ev=null,histCat='Livros',session=null;
const N={painel:'Painel',livros:'Livros',kits:'Kits',lideres:'Líderes',eventos:'Eventos',hist:'Histórico'};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const T=id=>D.livros.find(x=>x.id==id)?.titulo||'?';
const K=k=>T(k.livro_a)+' + '+T(k.livro_b);
const KK=id=>K(D.kits.find(k=>k.id==id));
const L=id=>D.lideres.find(x=>x.id==id)?.nome||'?';
const card=(n,l)=>`<div class="card"><b>${n}</b><span>${l}</span></div>`;
const tbl=(h,r)=>r.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map((c,i)=>`<td data-l="${esc(h[i])}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`:'<p class="vazio">Nada registado ainda.</p>';
const tblDel=(h,rows)=>rows.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${r.cols.map((c,i)=>`<td data-l="${esc(h[i])}">${esc(c)}</td>`).join('')}<td data-l="Ações"><button type="button" class="btn-x" data-del="${r.fn}" data-id="${r.id}" data-nome="${esc(r.nome)}">Excluir</button></td></tr>`).join('')}</table>`:'<p class="vazio">Nada registado ainda.</p>';
const num=(n,ph)=>`<input type="number" name="${n}" min="1" placeholder="${ph}" required>`;
const obs='<input name="p_obs" placeholder="Observações (opcional)">';
const combo=(n,items,lab,ph)=>{const data=JSON.stringify(items.map(x=>({id:x.id,l:lab(x)}))).replace(/</g,'\\u003c');
  return `<div class="combo"><input data-s placeholder="${ph}" autocomplete="off" required><input type="hidden" name="${n}"><div class="cl"></div><script type="application/json">${data}<\/script></div>`;};

// pesquisa tolerante a maiúsculas/acentos + deteção de nomes parecidos
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);return d[m][n];}
function parecido(novo,existentes){const nn=norm(novo);
  for(const ex of existentes) if(norm(ex)===nn) return {tipo:'igual',com:ex};
  for(const ex of existentes){const ne=norm(ex),lim=Math.max(2,Math.round(Math.max(nn.length,ne.length)*.25));
    if(lev(nn,ne)<=lim) return {tipo:'parecido',com:ex};}
  return null;}

async function load(){
  const q=t=>sb.from(t).select('*');
  const r=await Promise.all([q('livros').order('titulo'),q('tipos_kit'),q('lideres').order('nome'),q('eventos').order('data',{ascending:false}),q('equipes').order('numero'),q('saidas'),q('historico').order('id',{ascending:false}).limit(300)]);
  const e=r.find(x=>x.error); if(e) return alert(e.error.message);
  [D.livros,D.kits,D.lideres,D.eventos,D.equipes,D.saidas,D.hist]=r.map(x=>x.data);
  render();
}
const emFalta=()=>{const ab=D.eventos.filter(e=>!e.fechado).map(e=>e.id);
  return D.saidas.filter(s=>s.saiu>s.voltou&&D.equipes.some(q=>q.id==s.equipe_id&&ab.includes(q.evento_id)));};

const V={
painel(){const rua=emFalta();
  return `<div class="cards">${card(sum(D.livros,l=>l.caixas),'caixas fechadas')}${card(sum(D.livros,l=>l.soltos),'livros soltos')}${card(sum(D.kits,k=>k.qtd),'kits no CODE')}${card(sum(rua,s=>s.saiu-s.voltou),'kits na rua')}</div>
  <h2>Livros</h2>${tbl(['Título','Caixas','Soltos'],D.livros.map(l=>[l.titulo,l.caixas,l.soltos]))}
  <h2>Kits no CODE</h2>${tbl(['Kit','Quantidade'],D.kits.map(k=>[K(k),k.qtd]))}
  <h2>Kits na rua</h2>${tbl(['Líder','Kit','Em falta'],rua.map(s=>[L(D.equipes.find(q=>q.id==s.equipe_id).lider_id),KK(s.tipo_kit_id),s.saiu-s.voltou]))}`;},
livros(){return `<h2>Livros</h2>
  <form id="novoTitulo"><p>Novo título</p><input name="titulo" placeholder="Título do livro" required>${obs}<button>Adicionar título</button></form>
  <form data-fn="receber_caixas"><p>Chegaram caixas</p>${combo('p_livro',D.livros,l=>l.titulo,'Título')}${num('p_n','Nº de caixas')}${obs}<button>Registar caixas</button></form>
  <form data-fn="abrir_caixa"><p>Abrir uma caixa</p>${combo('p_livro',D.livros,l=>l.titulo,'Título')}${num('p_livros','Livros contados')}${obs}<button>Abrir caixa</button></form>
  ${tblDel(['Título','Caixas','Soltos'],D.livros.map(l=>({cols:[l.titulo,l.caixas,l.soltos],fn:'excluir_livro',id:l.id,nome:l.titulo})))}`;},
kits(){return `<h2>Kits</h2>
  <form data-fn="criar_kit"><p>Novo tipo de kit (a ordem não importa)</p>${combo('p_a',D.livros,l=>l.titulo,'Livro 1')}${combo('p_b',D.livros,l=>l.titulo,'Livro 2')}${obs}<button>Criar tipo</button></form>
  <form data-fn="montar_kits"><p>Montar kits com livros soltos</p>${combo('p_kit',D.kits,K,'Tipo de kit')}${num('p_n','Nº de kits')}${obs}<button>Montar</button></form>
  ${tblDel(['Kit','No CODE'],D.kits.map(k=>({cols:[K(k),k.qtd],fn:'excluir_kit',id:k.id,nome:K(k)})))}`;},
lideres(){const rua=emFalta();return `<h2>Líderes</h2>
  <form id="novoLider"><p>Novo líder</p><input name="nome" placeholder="Nome" required>${obs}<button>Adicionar líder</button></form>
  ${tblDel(['Líder','Kits em falta de devolver'],D.lideres.map(l=>({cols:[l.nome,rua.filter(s=>D.equipes.find(q=>q.id==s.equipe_id).lider_id==l.id).map(s=>(s.saiu-s.voltou)+'× '+KK(s.tipo_kit_id)).join('; ')||'—'],fn:'excluir_lider',id:l.id,nome:l.nome})))}`;},
eventos(){const e=D.eventos.find(x=>x.id==ev);
  let h=`<h2>Eventos</h2><form data-fn="criar_evento"><p>Novo evento</p><input type="date" name="p_data" required><input name="p_nota" placeholder="Nota (opcional)"><button>Criar evento</button></form>
  <div class="chips">${D.eventos.map(x=>`<button class="chip ${x.id==ev?'on':''}" onclick="ev=${x.id};render()">${x.data}${x.fechado?' (fechado)':''}</button>`).join('')}</div>`;
  if(!e) return h+'<p class="vazio">Escolha um evento acima.</p>';
  const eqs=D.equipes.filter(q=>q.evento_id==e.id);
  h+=`<h2>Evento de ${e.data}${e.nota?' – '+esc(e.nota):''}</h2>`;
  if(!e.fechado){
    h+=`<form data-fn="criar_equipe"><p>Adicionar equipa</p><input type="hidden" name="p_evento" value="${e.id}">${combo('p_lider',D.lideres,l=>l.nome,'Líder')}<button>Adicionar equipa</button></form>`;
    if(eqs.length) h+=`<form data-fn="saida_kits"><p>Saída de kits</p>${combo('p_equipe',eqs,q=>L(q.lider_id),'Líder')}${combo('p_kit',D.kits,K,'Kit')}${num('p_n','Quantidade')}${obs}<button>Registar saída</button></form>
    <form data-fn="retorno_kits"><p>Retorno de kits</p>${combo('p_equipe',eqs,q=>L(q.lider_id),'Líder')}${combo('p_kit',D.kits,K,'Kit')}${num('p_n','Quantidade')}${obs}<button>Registar retorno</button></form>`;
  }
  h+=eqs.length?tbl(['Equipa','Líder','Kit','Saíram','Voltaram'],D.saidas.filter(s=>eqs.some(q=>q.id==s.equipe_id)).map(s=>{const q=eqs.find(x=>x.id==s.equipe_id);return [q.numero,L(q.lider_id),KK(s.tipo_kit_id),s.saiu,s.voltou]})):'<p class="vazio">Ainda sem equipas.</p>';
  return h+(e.fechado?'':`<p><button class="btn" onclick="fechar(${e.id})">Fechar acerto</button></p>`);},
hist(){const cats=['Livros','Kits','Líderes','Eventos'],rows=D.hist.filter(x=>x.categoria==histCat);
  return `<h2>Histórico</h2><div class="chips">${cats.map(c=>`<button class="chip ${c==histCat?'on':''}" onclick="histCat='${c}';render()">${c}</button>`).join('')}</div>
  ${tbl(['Quando','Ação','Detalhe','Qtd','Obs.'],rows.map(x=>[new Date(x.quando).toLocaleString('pt-PT'),x.tipo,x.descricao,x.qtd??'',x.obs||'']))}`;}
};

function render(){
  if(!session){app.innerHTML=`<form id="login"><p>Estoque de livros</p><input name="email" placeholder="Utilizador" autocomplete="username" autocapitalize="none" required><input type="password" name="password" placeholder="Palavra-passe" required><button>Entrar</button></form>`;return;}
  app.innerHTML=`<nav>${Object.entries(N).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}<button onclick="sb.auth.signOut()">Sair</button></nav><main>${V[tab]()}</main>`;
}
function comboFiltrar(box,q){
  const items=JSON.parse(box.querySelector('script').textContent),nq=norm(q);
  const res=items.filter(x=>norm(x.l).includes(nq)).slice(0,8),cl=box.querySelector('.cl');
  cl.innerHTML=res.length?res.map(x=>`<div class="ci" data-id="${x.id}" data-l="${esc(x.l)}">${esc(x.l)}</div>`).join(''):'<div class="ci vazio">Sem resultados</div>';
  cl.style.display='block';
}
async function fechar(id){
  if(!confirm('Fechar o acerto? Os kits não devolvidos passam a ser dos líderes.')) return;
  const {error}=await sb.rpc('fechar_evento',{p_evento:id});
  error?alert(error.message):load();
}
app.addEventListener('input',e=>{
  if(!e.target.matches('.combo [data-s]')) return;
  const box=e.target.closest('.combo');
  box.querySelector('input[type=hidden]').value='';
  comboFiltrar(box,e.target.value);
});
app.addEventListener('focus',e=>{
  if(e.target.matches('.combo [data-s]')) comboFiltrar(e.target.closest('.combo'),e.target.value);
},true);
app.addEventListener('click',e=>{
  const ci=e.target.closest('.ci');
  if(!ci||ci.classList.contains('vazio')) return;
  const box=ci.closest('.combo');
  box.querySelector('input[type=hidden]').value=ci.dataset.id;
  box.querySelector('[data-s]').value=ci.dataset.l;
  box.querySelector('.cl').style.display='none';
});
document.addEventListener('click',e=>{if(!e.target.closest('.combo')) document.querySelectorAll('.cl').forEach(c=>c.style.display='none');});
app.addEventListener('click',async e=>{
  const btn=e.target.closest('button[data-del]');
  if(!btn) return;
  if(!confirm('Excluir "'+btn.dataset.nome+'"? Esta ação não pode ser desfeita.')) return;
  const {error}=await sb.rpc(btn.dataset.del,{p_id:Number(btn.dataset.id)});
  error?alert(error.message):load();
});

app.addEventListener('submit',async e=>{
  const f=e.target; e.preventDefault();
  if(f.id==='login'){const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim().toLowerCase()+DOMINIO,password:f.password.value});if(error)alert('Login inválido: '+error.message);return;}
  if(f.id==='novoTitulo'){
    const titulo=f.titulo.value.trim(),r=parecido(titulo,D.livros.map(l=>l.titulo));
    if(r?.tipo==='igual') return alert('Já existe exatamente esse título: "'+r.com+'"');
    if(r?.tipo==='parecido'&&!confirm('Já existe um título parecido: "'+r.com+'".\nTem a certeza que quer criar "'+titulo+'" como um título diferente?')) return;
    const {error}=await sb.rpc('criar_livro',{p_titulo:titulo,p_obs:f.p_obs.value||null});
    return error?alert(error.message):load();
  }
  if(f.id==='novoLider'){
    const nome=f.nome.value.trim(),r=parecido(nome,D.lideres.map(l=>l.nome));
    if(r?.tipo==='igual') return alert('Já existe exatamente esse líder: "'+r.com+'"');
    if(r?.tipo==='parecido'&&!confirm('Já existe um líder parecido: "'+r.com+'".\nTem a certeza que quer criar "'+nome+'" como uma pessoa diferente?')) return;
    const {error}=await sb.rpc('criar_lider',{p_nome:nome,p_obs:f.p_obs.value||null});
    return error?alert(error.message):load();
  }
  for(const box of f.querySelectorAll('.combo')){
    const hidden=box.querySelector('input[type=hidden]');
    if(!hidden.value) return alert('Selecione um item da lista para "'+box.querySelector('[data-s]').placeholder+'"');
  }
  const o={};
  for(const el of f.elements){if(!el.name)continue;
    o[el.name]=['number','hidden'].includes(el.type)?Number(el.value):(el.value||null);}
  const {error}=await sb.rpc(f.dataset.fn,o);
  error?alert(error.message):load();
});
render();
sb.auth.onAuthStateChange((_,s)=>{session=s;s?load():render();});
</script></body></html>
